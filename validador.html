<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIBA Validador V26.2</title>
<style>
body{font-family:Arial;padding:15px;background:#f0f0f0}
.card{background:white;padding:15px;border-radius:10px;max-width:600px;margin:auto}
.ok{color:green;font-weight:bold;font-size:20px}
.bad{color:red;font-weight:bold;font-size:20px}
pre{white-space:pre-wrap;background:#eee;padding:10px;font-size:11px}
</style>
</head>
<body>
<div class="card">
<h2>Validador SIBA V26.2 - FIX EXACTO</h2>
<div id="result">Cargando...</div>
<pre id="detalle"></pre>
</div>
<script>
async function main(){
 const v=new URLSearchParams(location.search).get('v')?.trim();
 if(!v){document.getElementById('result').innerHTML='<span class=bad>Sin folio</span>';return;}
 try{
  const resp=await fetch('https://raw.githubusercontent.com/robertohernandez-design/siba/main/folios.json?t='+Date.now());
  const folios=await resp.json();
  // FIX: BUSQUEDA EXACTA, NO INCLUDES
  let folio=folios.find(f=>f.folio_completo===v);
  if(!folio) folio=folios.find(f=>f.folio===v);
  if(!folio) folio=folios.find(f=>v.startsWith(f.folio_completo));
  if(!folio){
    const base=v.split('-').slice(0,4).join('-');
    folio=folios.find(f=>f.folio===base && v.includes(f.hash_corto));
  }
  if(!folio){document.getElementById('result').innerHTML='<span class=bad>❌ NO ENCONTRADO / ALTERADO</span><br>'+v;return;}
  document.getElementById('result').innerHTML='<span class=ok>✅ DOCUMENTO REGISTRADO COMO ORIGINAL</span><br><b>Folio:</b> '+folio.folio_completo+'<br><b>Fecha:</b> '+folio.fecha+'<br><b>Hash:</b> '+folio.hash_corto+'<br><b>Fotos:</b> '+folio.fotos+'/6';
  document.getElementById('detalle').innerText=folio.folio_completo+'\n'+folio.fecha+'\n'+folio.actividad+'\n\nPDF: '+folio.pdf+'\nHASH: '+folio.hash;
 }catch(e){document.getElementById('result').innerHTML='<span class=bad>Error '+e.message+'</span>';}
}
main();
</script>
</body>
</html>
