<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Validador SIBA V26 Blindado</title>
<style>
body{background:#f1f5f9;font-family:system-ui;padding:12px}
.card{max-width:700px;margin:20px auto;background:#fff;border-radius:14px;padding:18px;box-shadow:0 6px 20px #0002}
.ok{border-left:7px solid #16a34a}
.bad{border-left:7px solid #dc2626}
.badge{padding:7px 14px;border-radius:20px;font-weight:900;font-size:14px;display:inline-block}
.green{background:#dcfce7;color:#166534}
.red{background:#fee2e2;color:#991b1b}
pre{white-space:pre-wrap;background:#f8fafc;border:1px solid #e2e8f0;padding:12px;border-radius:8px;font-size:12px}
</style>
</head>
<body>
<div class="card" id="card"><h2 style="text-align:center">SIBA ES0477 - VALIDADOR V26</h2><div id="status">Cargando...</div></div>
<script>
const REPO="robertohernandez-design/siba";const FILE="folios.json";
const V=new URLSearchParams(location.search).get('v')||"";
async function main(){
 const el=document.getElementById('status');const card=document.getElementById('card');
 if(!V){el.innerHTML="Sin folio";return;}
 try{
  const r=await fetch(`https://raw.githubusercontent.com/${REPO}/main/${FILE}?t=${Date.now()}`);
  const folios=await r.json();
  let e=folios.find(f=>f.folio_completo===V);
  if(!e){const base=V.split('-').slice(0,4).join('-');e=folios.find(f=>V.startsWith(f.folio)||f.folio===base);}
  if(!e){card.className="card bad";el.innerHTML=`<span class=badge style="background:#fee2e2;color:#991b1b">⛔ NO EXISTE / FALSO</span><p>${V} no está en GitHub</p>`;return;}
  const hg=(e.hash||"").toLowerCase(); const hv=V.toLowerCase().split('-').pop();
  const ok = hg.includes(hv) || V.toLowerCase().includes(hg.substring(0,16));
  if(!ok){card.className="card bad";el.innerHTML=`<span class=badge style="background:#fee2e2;color:#991b1b">⛔ ALTERADO</span><p>Registrado: ${e.folio_completo}</p><p>Escaneado: ${V}</p><pre>${e.actividad}</pre>`;return;}
  card.className="card ok";
  el.innerHTML=`<span class=badge style="background:#dcfce7;color:#166534">✅ ORIGINAL VALIDO</span><p><b>${e.folio_completo}</b><br>${e.fecha}</p><pre>${e.actividad}</pre><p><small>Hash: ${hg}</small></p>`;
 }catch(err){el.innerHTML="Error: "+err.message;}
}
main();
</script>
</body>
</html>
