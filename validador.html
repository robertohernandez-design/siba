<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Validador SIBA ES0477</title>
<style>
body{font-family:system-ui,Arial;background:#f8fafc;padding:15px}
.card{max-width:600px;margin:0 auto;background:#fff;border:2px solid #000;border-radius:12px;padding:20px}
.ok{background:#dcfce7;border:2px solid #15803d;color:#14532d;padding:15px;border-radius:10px;text-align:center;font-weight:bold;font-size:18px}
.bad{background:#fee2e2;border:2px solid #dc2626;color:#7f1d1d;padding:15px;border-radius:10px;text-align:center;font-weight:bold;font-size:18px}
</style>
</head>
<body>
<div class="card">
<h2 style="text-align:center">SIBA ES0477 - VALIDADOR</h2>
<div id="resultado"></div>
<div id="detalles"></div>
</div>
<script>
const REPO="robertohernandez-design/siba";
const FILE="folios.json";
const v = new URLSearchParams(window.location.search).get('v')||'';
async function validar(){
 const r = await fetch(`https://raw.githubusercontent.com/${REPO}/main/${FILE}?t=${Date.now()}`);
 const folios = await r.json();
 const f = folios.find(x=>x.folio_completo===v);
 if(f){
  document.getElementById('resultado').innerHTML=`<div class="ok">✅ Documento VÁLIDO<br>Original sin alteraciones</div>`;
 }else{
  document.getElementById('resultado').innerHTML=`<div class="bad">❌ ADVERTENCIA: El PDF ha sido modificado o alterado<br>No es el documento original</div>`;
 }
}
validar();
</script>
</body>
</html>
