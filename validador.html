<script>
async function validar(){
  const params = new URLSearchParams(window.location.search);
  const folioParam = (params.get('v') || params.get('folio') || '').trim();
  const resDiv = document.getElementById('res');
  const datosDiv = document.getElementById('datos');
  if(!folioParam){
    resDiv.innerHTML='<div class=bad>❌ FOLIO NO PROPORCIONADO</div>';
    return;
  }
  try{
    const r = await fetch('./folios.json?v='+Date.now());
    const data = await r.json();
    const folios = Array.isArray(data) ? data : (data.folios || []);
    
    // Saca el hash y el número de folio del parametro largo
    const partes = folioParam.split('-');
    const hashBuscado = partes.pop().toLowerCase();
    const numFolioBuscado = partes.pop(); // 053

    const encontrado = folios.find(f => {
      const hashJson = String(f.hash || '').toLowerCase().trim();
      const numJson = String(f.folio || '').trim();
      // Compara por HASH o por numero de folio
      return hashJson === hashBuscado || numJson === numFolioBuscado || folioParam.toUpperCase().includes(hashJson.toUpperCase());
    });

    if(encontrado){
      resDiv.innerHTML = `<div class=ok>✅ FOLIO VALIDADO<br>No. ${folioParam}<br><br>VIGENTE Y REGISTRADO</div>`;
      datosDiv.style.display='block';
      datosDiv.innerHTML = `<b>Fecha:</b> ${encontrado.fecha || '-'}<br><b>Actividad:</b> ${(encontrado.actividad || '').substring(0,200)}...<br><b>Estación:</b> ${encontrado.estacion || 'ES0477'}<br><b>Fotos:</b> ${encontrado.fotos || 0}<br><b>Hash:</b> ${encontrado.hash}<br><b>Estatus:</b> Válido en SIBA`;
    }else{
      resDiv.innerHTML = `<div class=bad>❌ FOLIO NO VALIDO<br>No. ${folioParam}<br><br>No se encontró en base de datos</div>`;
    }
  }catch(e){
    resDiv.innerHTML = `<div class=bad>⚠️ ERROR<br>${e.message}</div>`;
  }
}
validar();
</script>
