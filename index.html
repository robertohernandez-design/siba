<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIBA ES0477 - Generador V21</title>
<style>
body{background:#0f172a;color:#e2e8f0;font-family:system-ui;padding:15px}
.card{background:#1e293b;border-radius:12px;padding:15px;margin-bottom:15px}
input,select,textarea{width:100%;background:#0f172a;color:#fff;border:1px solid #334155;border-radius:8px;padding:10px;margin:5px 0}
button{width:100%;padding:12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px}
.btn-yellow{background:#facc15;color:#000}
.btn-green{background:#22c55e;color:#000}
.log{background:#000;color:#22c55e;padding:10px;border-radius:8px;font-size:12px;margin-top:10px;min-height:20px}
</style>
</head>
<body>
<div class="card">
<input id="token" type="password" placeholder="ghp_...">
<button class="btn-yellow" onclick="guardarToken()">💾 Guardar Token</button>
<div id="info" style="background:#0f172a;padding:8px;border-radius:6px;margin-top:10px;font-size:13px">Folios: - | Siguiente: -</div>
</div>

<div class="card">
<label>Tipo:</label>
<select id="tipo">
<option>Inicio de Turno</option>
<option>Prueba con regleta</option>
<option>Fin de Turno</option>
<option>Calibracion</option>
<option>Mantenimiento</option>
</select>
<label>Actividad:</label>
<textarea id="actividad" rows="4">SE REALIZA PRUEBA CON REGLETA Y PASTA PARA DESCARTAR PRESENCIA DE AGUA  - ESTACION ES0477</textarea>
<button class="btn-green" onclick="generar()">🚀 GENERAR Y SUBIR CON QR</button>
<div id="log" class="log">Esperando...</div>
<div id="qr"></div>
</div>

<script>
const REPO = "robertohernandez-design/siba";
const FILE = "folios.json";
let folios = [];
let siguienteNum = 1;

function guardarToken(){
 localStorage.setItem("gh_token", document.getElementById("token").value.trim());
 log("Token guardado");
 cargarFolios();
}

function log(t){ document.getElementById("log").innerText = t; }

async function cargarFolios(){
 try{
  const r = await fetch(`https://raw.githubusercontent.com/${REPO}/main/${FILE}?t=${Date.now()}`);
  folios = await r.json();
  if(!Array.isArray(folios)) folios = [];
  // CALCULO CORRECTO DEL SIGUIENTE - usa folio_interno
  let max = 0;
  folios.forEach(f=>{
    let n = parseInt(f.folio_interno || "0");
    if(!n){
      // fallback: extrae el 053 de ES0477-2026-05-14-053-hash
      const m = (f.folio||"").match(/-(\d{3})-/);
      if(m) n = parseInt(m[1]);
    }
    if(n>max) max=n;
  });
  siguienteNum = max+1;
  document.getElementById("info").innerText = `Folios: ${folios.length} | Siguiente: ${String(siguienteNum).padStart(3,'0')}`;
  log(`Cargados ${folios.length} folios. Siguiente: ${String(siguienteNum).padStart(3,'0')}`);
 }catch(e){
  log("Error cargando folios: "+e.message);
 }
}

function genHash(){
 let r=""; const c="abcdef0123456789";
 for(let i=0;i<24;i++) r+=c[Math.floor(Math.random()*16)];
 return r;
}

async function generar(){
 const token = localStorage.getItem("gh_token") || document.getElementById("token").value.trim();
 if(!token) return log("Pon tu token ghp_");
 const tipo = document.getElementById("tipo").value;
 const actividad = document.getElementById("actividad").value.trim();
 if(!actividad) return log("Pon actividad");

 const numStr = String(siguienteNum).padStart(3,'0');
 const fechaISO = new Date().toISOString().split('T')[0];
 const hash = genHash();
 const folioBase = `ES0477-${fechaISO}-${numStr}`;
 const folioCompleto = `${folioBase}-${hash}`;
 const fechaLocal = new Date().toLocaleString('es-MX');

 const nuevo = {
   folio: folioBase,
   hash: hash,
   folio_completo: folioCompleto,
   fecha: fechaLocal,
   timestamp: new Date().toISOString(),
   estacion: "ES0477",
   folio_interno: numStr,
   tipo: tipo,
   actividad: actividad,
   observaciones: actividad
 };

 log(`Generando ${numStr}...`);
 folios.push(nuevo);

 // subir a github
 try{
  const apiUrl = `https://api.github.com/repos/${REPO}/contents/${FILE}`;
  const get = await fetch(apiUrl, {headers:{Authorization:`token ${token}`}});
  const data = await get.json();
  const sha = data.sha;
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(folios, null, 2))));
  const put = await fetch(apiUrl, {
    method:"PUT",
    headers:{Authorization:`token ${token}`, "Content-Type":"application/json"},
    body: JSON.stringify({message:`Agrega folio ${numStr}`, content: content, sha: sha})
  });
  if(!put.ok) throw new Error(await put.text());
  log(`✅ Folio ${folioCompleto} SUBIDO`);
  document.getElementById("qr").innerHTML = `<br><a style="color:#22c55e" target="_blank" href="https://robertohernandez-design.github.io/siba/validador.html?v=${folioCompleto}">🔗 Abrir validador de ${numStr}</a>`;
  cargarFolios();
 }catch(e){
  log("Error subiendo: "+e.message);
  folios.pop();
 }
}

(function(){
 const t = localStorage.getItem("gh_token");
 if(t) document.getElementById("token").value = t;
 cargarFolios();
})();
</script>
</body>
</html>
