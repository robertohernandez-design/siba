<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIBA ES0477 V13 PUBLICO</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>body{font-family:system-ui;background:#f1f5f9;margin:0;padding:20px}.card{max-width:800px;margin:0 auto;background:#fff;border-radius:16px;padding:24px}input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #cbd5e1;margin-bottom:8px}.btn{background:#0f172a;color:#fff;border:0;padding:12px 18px;border-radius:10px;font-weight:700;cursor:pointer;width:100%}.qrbox{margin-top:20px;border:2px dashed #cbd5e1;border-radius:12px;padding:16px;text-align:center}.link{word-break:break-all;background:#f8fafc;padding:8px;border-radius:6px;font-size:12px}</style>
</head>
<body>
<div class="card">
<h1>SIBA ES0477 - V13 QR PUBLICO</h1>
<p>Folio actual: <b id="foliolbl">054</b> | Servidor local: 192.168.1.64:8080</p>
Fecha: <input id="fecha" type="date">
Tipo: <select id="tipo"><option>Inicio de Turno</option><option>Fin de Turno</option><option>Prueba</option></select>
Responsable: <input id="responsable" value="R. Hernandez">
<button class="btn" onclick="generar()">GENERAR BITÁCORA Y QR PÚBLICO</button>
<div class="qrbox">
<div id="qrcode" style="display:flex;justify-content:center"></div>
<div id="qrtext" class="link"></div>
<div id="status" style="margin-top:10px;font-weight:700"></div>
</div>
<p style="font-size:11px;color:#64748b;margin-top:20px">Después de generar, debes actualizar tu folios.json en GitHub con el nuevo folio para que valide en público.</p>
</div>
<script>
const BASE = "https://robertohernandez-design.github.io/siba";
let folioNum = 54;
document.getElementById('fecha').valueAsDate = new Date();
document.getElementById('foliolbl').innerText = String(folioNum).padStart(3,'0');
function generar(){
  const folio = String(folioNum).padStart(3,'0');
  const fecha = document.getElementById('fecha').value;
  const tipo = document.getElementById('tipo').value;
  const urlPub = `${BASE}/validador.html?v=${folio}`;
  document.getElementById('qrcode').innerHTML='';
  new QRCode(document.getElementById('qrcode'),{text:urlPub,width:220,height:220});
  document.getElementById('qrtext').innerText = urlPub;
  // Guarda local
  fetch('http://192.168.1.64:8080/guardar.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({folio:folio,fecha:fecha,tipo:tipo,responsable:document.getElementById('responsable').value,timestamp:new Date().toLocaleString()})}).then(r=>r.text()).then(t=>{
    document.getElementById('status').innerHTML=`✅ Local OK: ${t}<br><br>⚠️ PASO FINAL: Ve a GitHub > folios.json > Edit y agrega el folio ${folio} para que valide público`;
    folioNum++; document.getElementById('foliolbl').innerText = String(folioNum).padStart(3,'0');
  }).catch(e=>{document.getElementById('status').innerHTML=`QR Generado (sin conexión local)<br>${e}`;});
}
</script>
</body>
</html>
