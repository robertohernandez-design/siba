<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIBA V26.5 FIX BOTON MUERTO</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body{font-family:Arial;padding:10px;background:#f5f5f5}
.card{background:white;padding:10px;border-radius:8px;margin-bottom:10px}
button{width:100%;padding:15px;background:#0a7a3c;color:white;border:none;border-radius:8px;font-weight:bold;font-size:16px}
#log{background:#000;color:#0f0;padding:10px;font-size:12px;min-height:120px;white-space:pre-wrap}
#preview img{width:30%;margin:1%;border:1px solid #ccc}
</style>
</head>
<body>
<h3>SIBA V26.5 - FIX CLICK</h3>
<div id="log">LOG: Iniciando...</div>
<div class="card">
Token: <input id="token" type="password" placeholder="ghp_..."><br>
<button onclick="localStorage.setItem('gh_token',document.getElementById('token').value);alert('Token guardado');log('Token guardado')">💾 Guardar Token</button>
Folio: <b id="folio">056</b> | <b id="estado">0/6</b>
</div>
<div class="card">
<textarea id="actividad" rows="8" placeholder="Actividad"></textarea>
<input type="file" id="fotos" multiple accept="image/*">
<div id="preview"></div>
<button id="btnGen" style="background:#555" disabled>Esperando 6 fotos...</button>
</div>
<script>
const logEl=document.getElementById('log');
function log(t){logEl.textContent+='\n'+t; console.log(t);}

let fotos=[];
let folioInterno='056';

document.getElementById('token').value=localStorage.getItem('gh_token')||'';
log('Sistema iniciado V26.5');

const inputFotos=document.getElementById('fotos');
inputFotos.addEventListener('change', async (e)=>{
  fotos=[]; document.getElementById('preview').innerHTML='';
  log('Cargando '+e.target.files.length+' fotos...');
  for(let i=0;i<e.target.files.length;i++){
    const f=e.target.files[i];
    const b64=await new Promise(res=>{const r=new FileReader(); r.onload=ev=>res(ev.target.result); r.readAsDataURL(f);});
    fotos.push(b64);
    const img=document.createElement('img'); img.src=b64; document.getElementById('preview').appendChild(img);
    log('Foto '+(i+1)+' cargada');
  }
  document.getElementById('estado').innerText=fotos.length+'/6';
  const btn=document.getElementById('btnGen');
  if(fotos.length===6){
    btn.disabled=false; btn.style.background='#0a7a3c'; btn.textContent='🔒 GENERAR FOLIO 056 (6/6 LISTO)';
    btn.onclick=generarFolio;
    log('6/6 LISTO - Boton activado');
  }else{
    btn.disabled=true; log('Necesitas 6 exactas');
  }
});

async function sha256(s){
  const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function generarFolio(){
  alert('¡Click detectado! Generando...');
  log('>>> CLICK DETECTADO <<<');
  try{
    const token=document.getElementById('token').value||localStorage.getItem('gh_token');
    log('Token: '+(token?'SI existe':'NO'));
    if(!token){alert('Falta token ghp_'); log('FALTA TOKEN'); return;}
    if(fotos.length!==6){alert('Faltan fotos '+fotos.length); log('FALTAN FOTOS'); return;}

    const actividad=document.getElementById('actividad').value.trim();
    if(!actividad){alert('Falta actividad'); log('FALTA ACTIVIDAD'); return;}
    log('Actividad: '+actividad.substring(0,30)+'...');

    if(typeof window.jspdf==='undefined'){log('ERROR: jspdf no cargo, revisa internet'); alert('jspdf no cargo, conecta a wifi y recarga'); return;}

    log('Creando PDF...');
    const {jsPDF}=window.jspdf; const doc=new jsPDF();
    doc.setFontSize(10); doc.text('SIBA ES0477-2026-09-23-056',10,10);
    doc.setFontSize(7); doc.text(actividad.substring(0,500),10,20);
    let y=40;
    for(let i=0;i<6;i++){ try{ doc.addImage(fotos[i],'JPEG',10+(i%3)*60, y+Math.floor(i/3)*40, 55,35); }catch(e){ log('Error imagen '+i); } }

    const fecha=new Date().toLocaleString('es-MX');
    const folioBase='ES0477-2026-09-23-056';
    const hash=await sha256(folioBase+actividad+fecha);
    const folioCompleto=folioBase+'-'+hash.substring(0,24);
    log('Folio: '+folioCompleto); log('Hash: '+hash.substring(0,12));
    doc.text(folioCompleto,10,130);

    const blob=doc.output('blob'); log('PDF tamaño: '+blob.size);
    const b64=await new Promise(r=>{const fr=new FileReader(); fr.onload=()=>r(fr.result.split(',')[1]); fr.readAsDataURL(blob);});

    log('Subiendo a GitHub...');
    const repo='robertohernandez-design/siba'; const path='documentos/'+folioCompleto+'.pdf';
    const resp=await fetch('https://api.github.com/repos/'+repo+'/contents/'+path,{
      method:'PUT',
      headers:{Authorization:'token '+token,'Content-Type':'application/json'},
      body:JSON.stringify({message:'Add '+folioCompleto,content:b64})
    });
    log('GitHub PDF status: '+resp.status);
    const txt=await resp.text(); log(txt.substring(0,200));
    if(!resp.ok){ alert('Error GitHub PDF: '+txt.substring(0,300)); return; }

    log('PDF subido, actualizando folios.json...');
    const f1=await fetch('https://api.github.com/repos/'+repo+'/contents/folios.json',{headers:{Authorization:'token '+token}});
    const d1=await f1.json(); const arr=JSON.parse(atob(d1.content));
    arr.push({folio:folioBase,folio_completo:folioCompleto,hash:hash,hash_corto:hash.substring(0,24),fecha:fecha,timestamp:new Date().toISOString(),estacion:'ES0477',folio_interno:'056',actividad:actividad,observaciones:actividad,fotos:6,pdf:path});
    const nuevo=btoa(unescape(encodeURIComponent(JSON.stringify(arr,null,2))));
    const f2=await fetch('https://api.github.com/repos/'+repo+'/contents/folios.json',{method:'PUT',headers:{Authorization:'token '+token,'Content-Type':'application/json'},body:JSON.stringify({message:'Add '+folioCompleto,content:nuevo,sha:d1.sha})});
    log('folios.json status: '+f2.status);
    if(f2.ok){ log('✅ GENERADO '+folioCompleto); alert('✅ GENERADO: '+folioCompleto); } else { log(await f2.text()); alert('Error folios.json'); }

  }catch(e){ log('❌ ERROR: '+e.message); alert('ERROR: '+e.message); }
}

// Activar folio
(async()=>{
  try{
    const t=localStorage.getItem('gh_token'); if(!t){document.getElementById('folio').innerText='056'; return;}
    const r=await fetch('https://api.github.com/repos/robertohernandez-design/siba/contents/folios.json',{headers:{Authorization:'token '+t}});
    if(!r.ok) return; const j=await r.json(); const a=JSON.parse(atob(j.content)); const last=a[a.length-1];
    if(last){ folioInterno=String(parseInt(last.folio_interno)+1).padStart(3,'0'); document.getElementById('folio').innerText=folioInterno; log('Ultimo folio: '+last.folio_interno+' -> siguiente '+folioInterno); }
  }catch(e){ log('No pude leer ultimo folio, uso 056'); }
})();
</script>
</body>
</html>
