<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIBA V26.6 CON QR FINAL</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body{font-family:Arial;padding:10px;background:#f5f5f5}
.card{background:white;padding:10px;border-radius:8px;margin-bottom:10px}
button{width:100%;padding:15px;background:#0a7a3c;color:white;border:none;border-radius:8px;font-weight:bold}
#log{background:#000;color:#0f0;padding:10px;font-size:12px;min-height:100px;white-space:pre-wrap}
#preview img{width:30%;margin:1%}
</style>
</head>
<body>
<h3>SIBA V26.6 - CON QR FINAL</h3>
<div id="log">LOG:</div>
<div class="card">
Token: <input id="token" type="password">
<button onclick="localStorage.setItem('gh_token',document.getElementById('token').value);log('Token guardado');alert('Guardado')">Guardar Token</button>
Folio: <b id="folio">...</b> | <b id="estado">0/6</b>
</div>
<div class="card">
<textarea id="actividad" rows="8">REVISION DE COMPRESOR...</textarea>
<input type="file" id="fotos" multiple accept="image/*">
<div id="preview"></div>
<button id="btnGen" disabled>Esperando 6 fotos</button>
</div>
<script>
function log(t){document.getElementById('log').textContent+='\n'+t;}
let fotos=[]; let folioInterno='057';
document.getElementById('token').value=localStorage.getItem('gh_token')||'';
const inputFotos=document.getElementById('fotos');
inputFotos.addEventListener('change', async (e)=>{
 fotos=[]; document.getElementById('preview').innerHTML='';
 for(let i=0;i<e.target.files.length;i++){
  const b64=await new Promise(r=>{const fr=new FileReader(); fr.onload=ev=>r(ev.target.result); fr.readAsDataURL(e.target.files[i]);});
  fotos.push(b64); const img=document.createElement('img'); img.src=b64; document.getElementById('preview').appendChild(img);
 }
 document.getElementById('estado').innerText=fotos.length+'/6';
 const btn=document.getElementById('btnGen');
 if(fotos.length===6){btn.disabled=false; btn.textContent='🔒 GENERAR FOLIO '+folioInterno+' CON QR'; btn.onclick=generarFolio; log('6/6 listo');}
});
async function sha256(s){const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
async function generarFolio(){
 alert('Generando con QR...'); log('Iniciando con QR');
 try{
  const token=document.getElementById('token').value||localStorage.getItem('gh_token');
  if(!token||fotos.length!==6){alert('Falta token o fotos');return;}
  const actividad=document.getElementById('actividad').value;
  const fecha=new Date().toLocaleString('es-MX');
  const folioBase=`ES0477-2026-09-23-${folioInterno}`;
  const hash=await sha256(folioBase+actividad+fecha);
  const folioCompleto=folioBase+'-'+hash.substring(0,24);
  const qrUrl=`https://robertohernandez-design.github.io/siba/validador.html?v=${folioCompleto}`;
  log('Folio: '+folioCompleto); log('QR url: '+qrUrl);

  // GENERAR QR COMO IMAGEN (no usa libreria bloqueada)
  log('Descargando QR...');
  const qrApi=`https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(qrUrl)}`;
  const qrBlob=await fetch(qrApi).then(r=>r.blob());
  const qrB64=await new Promise(r=>{const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(qrBlob);});

  const {jsPDF}=window.jspdf; const doc=new jsPDF();
  doc.setFontSize(10); doc.text('SIBA '+folioBase,10,10);
  doc.setFontSize(7); doc.text('Folio: '+folioCompleto,10,16); doc.text('Fecha: '+fecha,10,20);
  doc.text(doc.splitTextToSize(actividad,190),10,26);
  let y=60;
  for(let i=0;i<6;i++){try{doc.addImage(fotos[i],'JPEG',10+(i%3)*60,y+Math.floor(i/3)*40,55,35);}catch(e){}}
  y=145;
  doc.addImage(qrB64,'PNG',10,y,35,35);
  doc.setFontSize(6); doc.text(qrUrl,50,y+5); doc.text('VALIDAR ORIGINALIDAD - '+hash.substring(0,32),50,y+12);
  doc.text('Original sin alteraciones',10,285);

  const blob=doc.output('blob');
  const b64=await new Promise(r=>{const fr=new FileReader(); fr.onload=()=>r(fr.result.split(',')[1]); fr.readAsDataURL(blob);});
  const repo='robertohernandez-design/siba'; const path='documentos/'+folioCompleto+'.pdf';
  const resp=await fetch(`https://api.github.com/repos/${repo}/contents/${path}`,{method:'PUT',headers:{Authorization:'token '+token,'Content-Type':'application/json'},body:JSON.stringify({message:'Add '+folioCompleto,content:b64})});
  log('PDF status: '+resp.status);
  if(!resp.ok){log(await resp.text());return;}
  const f1=await fetch(`https://api.github.com/repos/${repo}/contents/folios.json`,{headers:{Authorization:'token '+token}});
  const d1=await f1.json(); const arr=JSON.parse(atob(d1.content));
  arr.push({folio:folioBase,folio_completo:folioCompleto,hash:hash,hash_corto:hash.substring(0,24),fecha:fecha,timestamp:new Date().toISOString(),estacion:'ES0477',folio_interno:folioInterno,actividad:actividad,observaciones:actividad,fotos:6,pdf:path});
  const nuevo=btoa(unescape(encodeURIComponent(JSON.stringify(arr,null,2))));
  const f2=await fetch(`https://api.github.com/repos/${repo}/contents/folios.json`,{method:'PUT',headers:{Authorization:'token '+token,'Content-Type':'application/json'},body:JSON.stringify({message:'Add '+folioCompleto,content:nuevo,sha:d1.sha})});
  log('folios status: '+f2.status);
  if(f2.ok){log('✅ CON QR GENERADO '+folioCompleto); alert('✅ LISTO CON QR: '+folioCompleto);}
 }catch(e){log('ERROR: '+e.message); alert(e.message);}
}
(async()=>{
 try{
  const t=localStorage.getItem('gh_token'); if(!t)return;
  const r=await fetch('https://api.github.com/repos/robertohernandez-design/siba/contents/folios.json',{headers:{Authorization:'token '+t}});
  const j=await r.json(); const a=JSON.parse(atob(j.content)); const last=a[a.length-1];
  folioInterno=String(parseInt(last.folio_interno)+1).padStart(3,'0');
  document.getElementById('folio').innerText=folioInterno;
  document.getElementById('btnGen').textContent='Esperando 6 fotos para '+folioInterno;
 }catch(e){}
})();
</script>
</body>
</html>
