<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIBA V26.9 056 DEL 22 CON QR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body{font-family:Arial;padding:10px;background:#f5f5f5}
.card{background:white;padding:10px;border-radius:8px;margin-bottom:10px}
button{width:100%;padding:15px;background:#0a7a3c;color:white;border:none;border-radius:8px;font-weight:bold}
#log{background:#000;color:#0f0;padding:10px;white-space:pre-wrap}
#preview img{width:30%;margin:1%}
input,textarea{width:100%;padding:8px;box-sizing:border-box;margin:4px 0}
</style>
</head>
<body>
<h3>V26.9 - 056 DEL 22 MISMA FECHA Y HORA + QR</h3>
<div id="log">LOG: Esperando token...</div>
<div class="card">
Token: <input id="token" type="password">
<button onclick="localStorage.setItem('gh_token',document.getElementById('token').value);log('Token guardado')">Guardar Token</button>
Folio base: <input id="folioBase" value="ES0477-2026-09-22-056" readonly>
Folio completo (se carga solo): <input id="folioCompleto" readonly>
Fecha original (se carga sola del 22): <input id="fechaOriginal" readonly>
Hash: <input id="hashCorto" readonly>
</div>
<div class="card">
Actividad: <textarea id="actividad" rows="8" readonly></textarea>
Fotos 6 (usa las mismas 6 de ayer): <input type="file" id="fotos" multiple accept="image/*">
<div id="preview"></div>
<button id="btnGen" disabled>Esperando 6 fotos</button>
</div>
<script>
function log(t){document.getElementById('log').textContent+='\n'+t;}
let fotos=[]; let datosOriginal=null;
document.getElementById('token').value=localStorage.getItem('gh_token')||'';
document.getElementById('fotos').addEventListener('change', async e=>{
 fotos=[]; document.getElementById('preview').innerHTML='';
 for(let i=0;i<e.target.files.length;i++){
  const b64=await new Promise(r=>{const fr=new FileReader(); fr.onload=ev=>r(ev.target.result); fr.readAsDataURL(e.target.files[i]);});
  fotos.push(b64); const img=document.createElement('img'); img.src=b64; document.getElementById('preview').appendChild(img);
 }
 if(fotos.length===6){const b=document.getElementById('btnGen'); b.disabled=false; b.textContent='🔒 REGENERAR 056 DEL 22 CON QR - MISMA FECHA Y HORA'; b.onclick=regenerar; log('6/6 listo');}
});

async function regenerar(){
 try{
  const token=document.getElementById('token').value||localStorage.getItem('gh_token');
  const folioCompleto=document.getElementById('folioCompleto').value;
  const folioBase=document.getElementById('folioBase').value;
  const fecha=document.getElementById('fechaOriginal').value;
  const hashCorto=document.getElementById('hashCorto').value;
  const actividad=document.getElementById('actividad').value;
  log('Regenerando: '+folioCompleto); log('Fecha original: '+fecha);
  const qrUrl=`https://robertohernandez-design.github.io/siba/validador.html?v=${folioCompleto}`;
  const qrApi=`https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(qrUrl)}`;
  const qrBlob=await fetch(qrApi).then(r=>r.blob());
  const qrB64=await new Promise(r=>{const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(qrBlob);});
  const {jsPDF}=window.jspdf; const doc=new jsPDF();
  doc.setFontSize(11); doc.text('SIBA - '+folioBase,10,12);
  doc.setFontSize(8); doc.text('Folio: '+folioCompleto,10,18); doc.text('Fecha: '+fecha+' | HASH: '+hashCorto,10,23);
  doc.setFontSize(7); let y=30; doc.text(doc.splitTextToSize(actividad,190),10,y); y+=45;
  let yFoto=y; const xPos=[10,75,140]; let idx=0;
  for(let r=0;r<2;r++){for(let c=0;c<3;c++){if(idx<6){doc.addImage(fotos[idx],'JPEG',xPos[c],yFoto,60,38);} idx++;} yFoto+=42;}
  doc.addImage(qrB64,'PNG',10,yFoto+5,32,32); doc.setFontSize(8); doc.text(qrUrl,50,yFoto+12); doc.text('VALIDAR ORIGINALIDAD',50,yFoto+20);
  doc.setFontSize(6); doc.text('Original sin alteraciones',10,285);
  const blob=doc.output('blob'); const b64=await new Promise(r=>{const fr=new FileReader(); fr.onload=()=>r(fr.result.split(',')[1]); fr.readAsDataURL(blob);});
  const repo='robertohernandez-design/siba'; const path='documentos/'+folioCompleto+'.pdf';
  log('Sobrescribiendo mismo PDF: '+path);
  const chk=await fetch(`https://api.github.com/repos/${repo}/contents/${path}`,{headers:{Authorization:'token '+token}});
  let sha=null; if(chk.ok){sha=(await chk.json()).sha;}
  const resp=await fetch(`https://api.github.com/repos/${repo}/contents/${path}`,{method:'PUT',headers:{Authorization:'token '+token,'Content-Type':'application/json'},body:JSON.stringify({message:'Regenera 056 22 con QR misma fecha',content:b64,sha:sha})});
  log('Status: '+resp.status);
  if(resp.ok){log('✅ 056 DEL 22 REGENERADO CON QR Y MISMA FECHA Y HORA'); alert('✅ LISTO:\n'+folioCompleto+'\nFecha: '+fecha+'\n\nAhora sí valida con QR y misma fecha del 22');} else {log(await resp.text()); alert('Error');}
 }catch(e){log('ERROR: '+e.message);}
}

(async()=>{
 try{
  const t=localStorage.getItem('gh_token'); if(!t){log('Pega token primero'); return;}
  log('Leyendo folios.json...');
  const r=await fetch('https://api.github.com/repos/robertohernandez-design/siba/contents/folios.json',{headers:{Authorization:'token '+t}});
  const j=await r.json(); const arr=JSON.parse(atob(j.content));
  const last=arr.find(f=>f.folio_interno==='056' || f.folio==='ES0477-2026-09-22-056' || f.folio==='ES0477-2026-09-23-056');
  const target=arr[arr.length-1]; // ultimo es el 056 sin QR
  datosOriginal=target;
  document.getElementById('folioBase').value=target.folio;
  document.getElementById('folioCompleto').value=target.folio_completo;
  document.getElementById('fechaOriginal').value=target.fecha;
  document.getElementById('hashCorto').value=target.hash_corto;
  document.getElementById('actividad').value=target.actividad;
  log('Datos del 056 cargados: '+target.folio); log('Fecha: '+target.fecha); log('Folio: '+target.folio_completo);
 }catch(e){log('Error cargando folios: '+e.message);}
})();
</script>
</body>
</html>
