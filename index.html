<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIBA V26.1 - HASH REAL + FIX QR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
body{font-family:Arial;padding:15px;background:#f5f5f5}
.card{background:white;padding:15px;border-radius:10px;margin-bottom:10px;box-shadow:0 2px 5px #0002}
input,textarea,button{width:100%;padding:10px;margin:5px 0;box-sizing:border-box}
button{background:#0a7a3c;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer}
#preview img{width:32%;margin:1%}
</style>
</head>
<body>
<h2>SIBA V26.1 - HASH REAL + 6 FOTOS - FIX QR</h2>
<div class="card">
<input id="token" placeholder="ghp_... Token GitHub" type="password">
<button onclick="localStorage.setItem('gh_token',document.getElementById('token').value);alert('Token guardado')">💾 Guardar Token</button>
<p>Folio: <b id="folio">055</b> | Carpeta: <span id="carpeta">/siba/documentos/</span></p>
<button onclick="seleccionarCarpeta()">📁 Seleccionar carpeta</button>
</div>
<div class="card">
<textarea id="actividad" rows="12" placeholder="Pega actividad completa..."></textarea>
<input type="file" id="fotos" multiple accept="image/*" onchange="previewFotos()">
<div id="preview"></div>
<button onclick="generarPDF()">🔒 GENERAR PDF CON HASH REAL</button>
</div>
<div id="log"></div>
<script>
let dirHandle=null; let fotosBase64=[]; let folioInterno="056";
async function seleccionarCarpeta(){try{dirHandle=await window.showDirectoryPicker();}catch(e){}}
function previewFotos(){const files=document.getElementById('fotos').files;fotosBase64=[];document.getElementById('preview').innerHTML='';for(let f of files){const r=new FileReader();r.onload=e=>{fotosBase64.push(e.target.result);const img=document.createElement('img');img.src=e.target.result;document.getElementById('preview').appendChild(img);};r.readAsDataURL(f);}}
function log(t){document.getElementById('log').innerHTML+='<p>'+t+'</p>';}
function getFolioBase(){const hoy=new Date();const fechaStr=`${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}-${String(hoy.getDate()).padStart(2,'0')}`;return `ES0477-${fechaStr}-${folioInterno}`;}
async function sha256(str){const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');}
async function generarPDF(){
 if(fotosBase64.length!==6){alert('6 fotos exactas');return;}
 const token=document.getElementById('token').value||localStorage.getItem('gh_token'); if(!token){alert('token');return;}
 const actividad=document.getElementById('actividad').value.trim(); if(!actividad){alert('actividad');return;}
 const actividadNorm=actividad.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
 const fecha=new Date().toLocaleString('es-MX'); const folioBase=getFolioBase();
 const hashActividad=await sha256(actividadNorm); const hashCompleto=await sha256(folioBase+actividadNorm+fecha);
 const hashCorto=hashCompleto.substring(0,24); const folioCompleto=`${folioBase}-${hashCorto}`;
 const {jsPDF}=window.jspdf; const doc=new jsPDF();
 doc.setFontSize(12); doc.text(`SIBA - ${folioBase}`,10,15);
 doc.setFontSize(8); doc.text(`Folio completo: ${folioCompleto}`,10,22); doc.text(`Fecha: ${fecha}`,10,27); doc.text(`Estacion: ES0477 | HASH: ${hashCorto}...`,10,32);
 doc.setFontSize(7); let y=42; actividad.split('\n').forEach(l=>{doc.text(l.substring(0,115),10,y); y+=5;});
 // FOTOS ARRIBA
 let yFoto=y+5; const xPos=[10,75,140]; let idx=0;
 for(let row=0;row<2;row++){for(let col=0;col<3;col++){if(idx<fotosBase64.length){try{doc.addImage(fotosBase64[idx],'JPEG',xPos[col],yFoto,60,38);}catch(e){}} idx++;} yFoto+=42;}
 // QR ABAJO CON MARGEN - FIX EMPALME
 let finalY=yFoto+10; if(finalY>230){doc.addPage(); finalY=20;}
 const qrUrl=`https://robertohernandez-design.github.io/siba/validador.html?v=${folioCompleto}`;
 const qrCanvas=document.createElement('canvas'); await QRCode.toCanvas(qrCanvas,qrUrl,{width:200}); const qrData=qrCanvas.toDataURL();
 doc.setFontSize(6); doc.text(qrUrl,10,finalY); doc.addImage(qrData,'PNG',10,finalY+2,35,35);
 doc.setFontSize(7); doc.text(`ESCANEA PARA VALIDAR - HASH: ${hashCorto.substring(0,12)}`,50,finalY+10); doc.text(`Folio: ${folioBase}`,50,finalY+16);
 doc.setFontSize(6); doc.text(`Documento valido - Original sin alteraciones - ${hashCompleto}`,10,285);
 const pdfBlob=doc.output('blob'); const pdfArray=await pdfBlob.arrayBuffer(); const pdfBase64=btoa(String.fromCharCode(...new Uint8Array(pdfArray)));
 try{if(dirHandle){const fh=await dirHandle.getFileHandle(`${folioCompleto}.pdf`,{create:true});const w=await fh.createWritable();await w.write(pdfBlob);await w.close();}}catch(e){}
 const repo='robertohernandez-design/siba'; const pathDoc=`documentos/${folioCompleto}.pdf`;
 let sha=null; try{const r=await fetch(`https://api.github.com/repos/${repo}/contents/${pathDoc}`,{headers:{Authorization:`token ${token}`}}); if(r.ok){const j=await r.json(); sha=j.sha;}}catch(e){}
 await fetch(`https://api.github.com/repos/${repo}/contents/${pathDoc}`,{method:'PUT',headers:{Authorization:`token ${token}`,'Content-Type':'application/json'},body:JSON.stringify({message:`Add ${pathDoc}`,content:pdfBase64,sha:sha})});
 const foliosResp=await fetch(`https://api.github.com/repos/${repo}/contents/folios.json`,{headers:{Authorization:`token ${token}`}}); const foliosData=await foliosResp.json(); const foliosContent=JSON.parse(atob(foliosData.content));
 foliosContent.push({folio:folioBase,hash:hashCompleto,hash_corto:hashCorto,folio_completo:folioCompleto,fecha:fecha,timestamp:new Date().toISOString(),estacion:"ES0477",folio_interno:folioInterno,tipo:"Inicio de Turno",actividad:actividad,observaciones:actividad,fotos:6,pdf:pathDoc,sha_actividad:hashActividad});
 const nuevoContent=btoa(unescape(encodeURIComponent(JSON.stringify(foliosContent,null,2))));
 await fetch(`https://api.github.com/repos/${repo}/contents/folios.json`,{method:'PUT',headers:{Authorization:`token ${token}`,'Content-Type':'application/json'},body:JSON.stringify({message:`Add ${folioCompleto}`,content:nuevoContent,sha:foliosData.sha})});
 log('✅ '+folioCompleto+' SUBIDO'); alert('GENERADO: '+folioCompleto);
}
document.getElementById('token').value=localStorage.getItem('gh_token')||'';
(async()=>{try{const t=localStorage.getItem('gh_token'); if(!t) return; const r=await fetch('https://api.github.com/repos/robertohernandez-design/siba/contents/folios.json',{headers:{Authorization:`token ${t}`}}); const j=await r.json(); const arr=JSON.parse(atob(j.content)); const last=arr[arr.length-1]; if(last){const num=parseInt(last.folio_interno)+1; folioInterno=String(num).padStart(3,'0'); document.getElementById('folio').innerText=folioInterno;}}catch(e){}})();
</script>
</body>
</html>
