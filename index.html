<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIBA ES0477 V15 AUTO GITHUB</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>body{font-family:system-ui;background:#f1f5f9;margin:0;padding:12px}.card{max-width:800px;margin:0 auto;background:#fff;border-radius:16px;padding:20px}input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #cbd5e1;margin-bottom:8px;box-sizing:border-box}.btn{background:#0f172a;color:#fff;border:0;padding:14px;border-radius:10px;font-weight:700;cursor:pointer;width:100%;margin-bottom:10px}.btn-green{background:#16a34a}.qrbox{margin-top:15px;border:2px dashed #16a34a;border-radius:12px;padding:16px;text-align:center}.link{word-break:break-all;background:#f8fafc;padding:8px;border-radius:6px;font-size:11px;margin-top:8px;text-align:left}.token-box{background:#fef3c7;border:1px solid #f59e0b;padding:12px;border-radius:8px;margin-bottom:15px}</style>
</head>
<body>
<div class="card">
<h2>SIBA ES0477 - V15 AUTO GITHUB</h2>
<p>Repo: <b>robertohernandez-design/siba</b> | Folio: <b id="foliolbl">054</b></p>

<div class="token-box">
<b>🔑 Token GitHub (solo 1ra vez):</b>
<input id="token" type="password" placeholder="pega tu token ghp_... aquí">
<button onclick="guardarToken()" style="width:auto;padding:6px 12px;font-size:12px">Guardar Token en este celular</button>
<p style="font-size:10px;margin:5px 0 0">Se guarda local, no se sube a GitHub. Caduca en 90 días.</p>
<div id="tokenStatus" style="font-size:11px;font-weight:700;margin-top:5px"></div>
</div>

Fecha: <input id="fecha" type="date">
Tipo: <select id="tipo"><option>Inicio de Turno</option><option>Fin de Turno</option><option>Prueba con regleta</option><option>Hermeticidad Veeder Root</option></select>
Responsable: <input id="responsable" value="R. Hernandez">
Actividad: <textarea id="actividad" rows="3">SE REALIZÓ PRUEBA CON REGLETA Y PASTA PARA DESCARTAR PRESENCIA DE HIDROCARBUROS EN POZOS DE OBSERVACION.</textarea>

<button class="btn" onclick="generarYSubir()">🚀 GENERAR 054 Y SUBIR AUTOMÁTICO A GITHUB</button>

<div class="qrbox">
<div id="qrcode" style="display:flex;justify-content:center"></div>
<div id="qrtext" class="link"></div>
<div id="status" style="margin-top:10px;font-weight:700;font-size:13px"></div>
</div>
</div>

<script>
const BASE = "https://robertohernandez-design.github.io/siba";
const REPO_OWNER = "robertohernandez-design";
const REPO_NAME = "siba";
const FILE_PATH = "folios.json";
const ESTACION = "ES0477";
let folioNum = 54;

document.getElementById('fecha').valueAsDate = new Date();
document.getElementById('foliolbl').innerText = String(folioNum).padStart(3,'0');

// Cargar token guardado
if(localStorage.getItem('gh_token')){
  document.getElementById('token').value = localStorage.getItem('gh_token');
  document.getElementById('tokenStatus').innerText = "✅ Token cargado";
  document.getElementById('tokenStatus').style.color = "green";
}

function guardarToken(){
  const t = document.getElementById('token').value.trim();
  if(!t.startsWith('ghp_') &&!t.startsWith('github_pat_')){ alert('Token debe empezar con ghp_...'); return; }
  localStorage.setItem('gh_token', t);
  document.getElementById('tokenStatus').innerText = "✅ Token guardado en este celular";
  document.getElementById('tokenStatus').style.color = "green";
}

function simpleHash(str){
  let hash=0; for(let i=0;i<str.length;i++){hash=((hash<<5)-hash)+str.charCodeAt(i); hash|=0;}
  return Math.abs(hash).toString(16).padStart(8,'0') + Math.random().toString(16).substring(2,10);
}

async function generarYSubir(){
  const token = localStorage.getItem('gh_token') || document.getElementById('token').value.trim();
  if(!token){ alert('Primero pega tu token ghp_ y guarda'); return; }

  const folio = String(folioNum).padStart(3,'0');
  const fechaInput = document.getElementById('fecha').value;
  const [yyyy,mm,dd] = fechaInput.split('-');
  const tipo = document.getElementById('tipo').value;
  const hash = simpleHash(`${ESTACION}-${fechaInput}-${folio}-${Date.now()}`).substring(0,16);
  const folioCompleto = `${ESTACION}-${yyyy}-${mm}-${dd}-${folio}-${hash}`;
  const urlPub = `${BASE}/validador.html?v=${folioCompleto}`;

  // Mostrar QR inmediatamente
  document.getElementById('qrcode').innerHTML='';
  new QRCode(document.getElementById('qrcode'),{text:urlPub,width:240,height:240});
  document.getElementById('qrtext').innerText = urlPub;
  document.getElementById('status').innerHTML = "⏳ Subiendo a GitHub...";

  try{
    // 1. Obtener folios.json actual y su SHA
    const getResp = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`,{
      headers:{'Authorization':`token ${token}`,'Accept':'application/vnd.github.v3+json'}
    });
    if(!getResp.ok) throw new Error('No pude leer folios.json - revisa token y repo');
    const fileData = await getResp.json();
    const currentContent = JSON.parse(atob(fileData.content));
    const sha = fileData.sha;

    // 2. Agregar nuevo folio
    currentContent[folioCompleto] = {hash:hash, fecha:new Date().toLocaleString('es-MX'), tipo:tipo};
    const newContentStr = JSON.stringify(currentContent, null, 2);
    const newContentB64 = btoa(unescape(encodeURIComponent(newContentStr)));

    // 3. Subir actualizado
    const putResp = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`,{
      method:'PUT',
      headers:{'Authorization':`token ${token}`,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
      body:JSON.stringify({message:`Add folio ${folioCompleto} auto V15`, content:newContentB64, sha:sha, branch:'main'})
    });
    if(!putResp.ok){ const err = await putResp.text(); throw new Error(err); }

    document.getElementById('status').innerHTML = `✅ FOLIO ${folioCompleto}<br>SUBIDO AUTOMÁTICO A GITHUB<br><br>En 20-40 seg validará verde en:<br>${urlPub}<br><br>Ya puedes generar tu PDF con este QR`;
    folioNum++; document.getElementById('foliolbl').innerText = String(folioNum).padStart(3,'0');

  }catch(e){
    document.getElementById('status').innerHTML = `❌ Error: ${e.message}<br><br>El QR sí está bueno, pero no se subió solo.<br>Copia manual: "${folioCompleto}": {"hash":"${hash}"}`;
    console.error(e);
  }
}
</script>
</body>
</html>
