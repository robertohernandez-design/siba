<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIBA V18 QR PDF</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body{font-family:system-ui;background:#0f172a;color:#fff;padding:15px;max-width:520px;margin:0 auto}
.card{background:#1e293b;border-radius:16px;padding:18px;margin-bottom:15px;border:1px solid #334155}
label{font-size:13px;color:#94a3b8;display:block;margin:8px 0 4px}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#fff;font-size:15px;box-sizing:border-box}
button{width:100%;padding:14px;border-radius:12px;border:0;font-weight:800;font-size:16px;cursor:pointer;margin-top:10px}
.btn-yellow{background:#facc15;color:#000}
.btn-green{background:#22c55e;color:#000}
.btn-red{background:#ef4444;color:#fff}
.log{font-size:12px;background:#000;padding:10px;border-radius:8px;white-space:pre-wrap;word-break:break-all;max-height:250px;overflow:auto;margin-top:10px}
#qrcode{display:flex;justify-content:center;background:#fff;padding:15px;border-radius:12px;margin:15px 0}
.ok{color:#4ade80}.err{color:#f87171}
</style>
</head>
<body>
<h2>🚀 SIBA V18 - CON QR EN PDF</h2>
<div class="card">
<label>Token:</label>
<input id="token" type="password" placeholder="ghp_...">
<button class="btn-yellow" onclick="guardarToken()">💾 Guardar Token</button>
<div id="tokenStatus" class="log"></div>
<div style="margin-top:10px;background:#0f172a;padding:10px;border-radius:8px;font-size:13px">
Folios: <span id="count">-</span> | Siguiente: <b id="nextFolio">-</b>
</div>
</div>
<div class="card">
<label>Tipo:</label>
<select id="tipo"><option>Inicio de Turno</option><option>Fin de Turno</option><option>Prueba con regleta</option><option>Prueba</option></select>
<label>Actividad:</label>
<textarea id="obs" rows="3">SE REALIZA PRUEBA CON REGLETA Y PASTA PARA DESCARTAR PRESENCIA DE AGUA - ESTACION ES0477</textarea>
<button class="btn-green" onclick="generar()">🚀 GENERAR Y SUBIR CON QR</button>
<div id="status" class="log">Esperando...</div>
<div id="qrcode"></div>
<div id="link"></div>
</div>
<script>
const REPO_OWNER="robertohernandez-design",REPO_NAME="siba",FILE_PATH="folios.json";
let shaActual=null;
function log(m,e=false){document.getElementById('status').innerHTML=`<span class="${e?'err':'ok'}">${m}</span>\n`+document.getElementById('status').innerHTML}
function guardarToken(){const t=document.getElementById('token').value.trim();localStorage.setItem('siba_token_v18',t);document.getElementById('tokenStatus').innerHTML='✅ Token '+t.length;log('✅ Token guardado')}
(function(){const t=localStorage.getItem('siba_token_v18')||localStorage.getItem('siba_token_v17');if(t){document.getElementById('token').value=t;document.getElementById('tokenStatus').innerHTML='✅ Token guardado'}})();
function toB64(s){let b=new TextEncoder().encode(s),bin='';b.forEach(x=>bin+=String.fromCharCode(x));return btoa(bin)}
function fromB64(b64){let bin=atob(b64.replace(/\n/g,'')),u=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(u)}
async function getFile(token){const r=await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`,{headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'}});if(!r.ok)throw new Error('GET '+r.status);const j=await r.json();return{sha:j.sha,json:JSON.parse(fromB64(j.content))}}
function extraerNumero(f){if(!f)return 0;if(/^\d+$/.test(f.trim()))return parseInt(f.trim());let m=f.match(/-(\d{3,})-/);if(m)return parseInt(m[1]);return 0}
async function cargarInfo(){try{const r=await fetch(`https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${FILE_PATH}?t=${Date.now()}`);const arr=await r.json();document.getElementById('count').textContent=arr.length;let max=0;arr.forEach(f=>{let n=extraerNumero(f.folio);if(n>max)max=n});document.getElementById('nextFolio').textContent=String(max+1).padStart(3,'0')}catch{}}
cargarInfo();
async function generar(){
  const token=document.getElementById('token').value.trim()||localStorage.getItem('siba_token_v18')||localStorage.getItem('siba_token_v17');
  if(!token){alert('Token');return;}
  const tipo=document.getElementById('tipo').value,obs=document.getElementById('obs').value;
  try{
    log('⏳ Leyendo...');const file=await getFile(token);let arr=file.json,sha=file.sha;let max=0;arr.forEach(f=>{let n=extraerNumero(f.folio);if(n>max)max=n});const nextNum=max+1,nextStr=String(nextNum).padStart(3,'0');const fecha=new Date().toISOString().slice(0,10),rand=Math.random().toString(16).slice(2,10)+Math.random().toString(16).slice(2,10);const folioId=`ES0477-${fecha}-${nextStr}-${rand.slice(0,16)}`;
    log(`⏳ Generando ${folioId}...`);
    arr.push({folio:folioId,fecha:fecha,tipo:tipo,actividad:obs,observaciones:obs,timestamp:new Date().toISOString(),estacion:"ES0477",fotos:0,hash:rand.slice(0,16)});
    const b64=toB64(JSON.stringify(arr,null,2));
    log('⏳ Subiendo...');
    const put=await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`,{method:'PUT',headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:`Add ${folioId} V18`,content:b64,sha:sha})});
    if(!put.ok)throw new Error('PUT '+put.status+' '+(await put.text()).slice(0,300));
    log(`✅ SUBIDO ${folioId} - Total ${arr.length}`);
    const valUrl=`https://robertohernandez-design.github.io/siba/validador.html?v=${folioId}`;
    document.getElementById('qrcode').innerHTML=''; new QRCode(document.getElementById('qrcode'),{text:valUrl,width:220,height:220});
    document.getElementById('link').innerHTML=`<div class=log><a href="${valUrl}" target="_blank" style="color:#4ade80">${valUrl}</a></div>`;
    setTimeout(()=>{
      const canvas=document.querySelector('#qrcode canvas'); const imgData=canvas.toDataURL('image/png');
      const {jsPDF}=window.jspdf; const doc=new jsPDF();
      doc.setFontSize(14); doc.text(`SIBA - ${folioId}`,10,20);
      doc.setFontSize(11); doc.text(`Tipo: ${tipo}`,10,30);
      doc.text(`Actividad:`,10,40); doc.setFontSize(10); doc.text(doc.splitTextToSize(obs, 180),10,48);
      doc.addImage(imgData,'PNG',60,80,90,90);
      doc.setFontSize(8); doc.text(valUrl,10,180);
      doc.save(folioId+'.pdf');
      log('✅ PDF CON QR DESCARGADO');
    },500);
    cargarInfo();
  }catch(e){log('❌ '+e.message,true)}
}
</script>
</body>
</html>
