<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIBA V26.4 DEBUG</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body{font-family:Arial;padding:10px;background:#f5f5f5}
.card{background:white;padding:10px;border-radius:8px;margin-bottom:10px}
button{width:100%;padding:12px;background:#0a7a3c;color:white;border:none;border-radius:6px;font-weight:bold}
#log{background:#111;color:#0f0;padding:10px;font-size:12px;min-height:100px;white-space:pre-wrap}
#preview img{width:30%;margin:1%}
</style>
</head>
<body>
<h3>SIBA V26.4 DEBUG</h3>
<div id="log">LOG INICIANDO...
</div>
<div class="card">
Token: <input id="token" type="password" placeholder="ghp_...">
<button onclick="localStorage.setItem('gh_token',document.getElementById('token').value);alert('Guardado');location.reload()">Guardar Token y Recargar</button>
Folio: <b id="folio">Cargando...</b> Fotos: <b id="estado">0/6</b>
</div>
<div class="card">
<textarea id="actividad" rows="8">REVISION DE COMPRESOR
REVISION MENSUAL EXTINTORES
PRUEBA PAROS
BOMBA SUMERGIBLE
SENALAMIENTO
PISOS CARGA</textarea>
<input type="file" id="fotos" multiple accept="image/*">
<div id="preview"></div>
<button id="btnGen" onclick="generar()">GENERAR FOLIO 56</button>
</div>
<script>
function log(t){document.getElementById('log').textContent+='\n'+new Date().toLocaleTimeString()+' '+t;}
log('JS cargado OK');
let fotos=[];
document.getElementById('fotos').addEventListener('change', async (e)=>{
 fotos=[]; document.getElementById('preview').innerHTML='';
 const files=e.target.files; log('Seleccionaste '+files.length);
 for(let i=0;i<files.length;i++){
  const b64=await new Promise(r=>{const fr=new FileReader(); fr.onload=e=>r(e.target.result); fr.readAsDataURL(files[i]);});
  fotos.push(b64);
 }
 document.getElementById('estado').innerText=fotos.length+'/6';
 log('Fotos en memoria: '+fotos.length);
});
let folioInterno='056';
async function sha256(s){const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');}
async function generar(){
 try{
  log('Click generar');
  const token=document.getElementById('token').value||localStorage.getItem('gh_token');
  log('Token: '+(token?'SI':'NO')); if(!token){alert('Falta token');return;}
  if(fotos.length!==6){alert('Tienes '+fotos.length+'/6');return;}
  const actividad=document.getElementById('actividad').value;
  log('Generando PDF...'); const {jsPDF}=window.jspdf; const doc=new jsPDF();
  doc.text('PRUEBA SIBA 056',10,10); doc.text(actividad.substring(0,100),10,20);
  let y=30; for(let i=0;i<6;i++){try{doc.addImage(fotos[i],'JPEG',10+(i%3)*65,y+Math.floor(i/3)*45,60,40);}catch(e){log('Error foto '+i);}}
  const fecha=new Date().toLocaleString('es-MX'); const folioBase='ES0477-2026-09-23-056'; const hash=await sha256(folioBase+actividad+fecha); const folioCompleto=folioBase+'-'+hash.substring(0,24);
  doc.text(folioCompleto,10,130); const blob=doc.output('blob'); log('PDF tam: '+blob.size);
  const b64=await new Promise(r=>{const fr=new FileReader(); fr.onload=()=>r(fr.result.split(',')[1]); fr.readAsDataURL(blob);});
  const repo='robertohernandez-design/siba'; const path='documentos/'+folioCompleto+'.pdf';
  const res=await fetch('https://api.github.com/repos/'+repo+'/contents/'+path,{method:'PUT',headers:{Authorization:'token '+token,'Content-Type':'application/json'},body:JSON.stringify({message:'Add '+path,content:b64})});
  log('Subida PDF status: '+res.status);
  if(!res.ok){log(await res.text());return;}
  log('PDF OK, actualizando folios.json');
  const fr2=await fetch('https://api.github.com/repos/'+repo+'/contents/folios.json',{headers:{Authorization:'token '+token}}); const fd=await fr2.json(); const fc=JSON.parse(atob(fd.content));
  fc.push({folio:folioBase,folio_completo:folioCompleto,hash:hash,hash_corto:hash.substring(0,24),fecha:fecha,timestamp:new Date().toISOString(),estacion:'ES0477',folio_interno:'056',actividad:actividad,observaciones:actividad,fotos:6,pdf:path});
  const nuevo=btoa(unescape(encodeURIComponent(JSON.stringify(fc,null,2))));
  const res2=await fetch('https://api.github.com/repos/'+repo+'/contents/folios.json',{method:'PUT',headers:{Authorization:'token '+token,'Content-Type':'application/json'},body:JSON.stringify({message:'Add '+folioCompleto,content:nuevo,sha:fd.sha})});
  log('folios.json status: '+res2.status); if(res2.ok){log('✅ OK '+folioCompleto); alert('OK '+folioCompleto);} else {log(await res2.text());}
 }catch(err){log('❌ '+err.message); alert(err.message);}
}
(function(){document.getElementById('token').value=localStorage.getItem('gh_token')||'';})();
</script>
</body>
</html>
