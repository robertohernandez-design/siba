<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validador SIBA V21</title>
<style>
body{background:#0f172a;color:#fff;font-family:system-ui;padding:12px}
.card{max-width:560px;margin:20px auto;background:#fff;color:#111;border-radius:20px;padding:22px}
.ok{background:#dcfce7;border:2px solid #22c55e;color:#14532d;border-radius:16px;padding:16px;text-align:center;font-weight:800;word-break:break-all}
.actividad{background:#f1f5f9;border:1px solid #94a3b8;border-radius:12px;padding:14px;margin-top:14px;white-space:pre-wrap;line-height:1.4;font-size:14px;color:#000}
.row{margin:6px 0}
.label{font-weight:800}
</style>
</head>
<body>
<div class="card">
<h2 style="text-align:center;margin:0">PEMEX - SIBA ES0477<br>Validador Oficial</h2>
<div id="r" style="margin-top:15px">Cargando...</div>
<div id="d"></div>
</div>
<script>
(async()=>{
  const v=new URLSearchParams(location.search).get('v')||'';
  const r=document.getElementById('r'), d=document.getElementById('d');
  if(!v){r.innerHTML='Falta ?v=';return}
  const j=await fetch('./folios.json?nocache='+Date.now()).then(x=>x.json());
  console.log('folios',j);
  let f=j.find(x=>x.hash && v.includes(x.hash)) || j.find(x=>x.folio===v) || j.find(x=>v.includes(x.folio));
  if(!f && v.includes('75ced0ff38049ce71a0a25ec8b7')) f=j.find(x=>x.hash==='75ced0ff38049ce71a0a25ec8b7');
  if(!f){r.innerHTML='<div style="background:#fee2e2;padding:12px;border-radius:12px">❌ NO ENCONTRADO: '+v+'</div>';return}
  r.innerHTML='<div class="ok">✅ FOLIO VALIDADO<br>'+v+'<br><br>VIGENTE Y REGISTRADO</div>';
  d.innerHTML=`
    <div class="row"><span class="label">Fecha:</span> ${f.fecha||f.timestamp}</div>
    <div class="row"><span class="label">Estación:</span> ${f.estacion}</div>
    <div class="row"><span class="label">Folio interno:</span> ${f.folio}</div>
    <div class="row"><span class="label">Hash:</span> ${f.hash}</div>
    <div class="row"><span class="label">Tipo:</span> ${f.tipo}</div>
    <div class="label" style="margin-top:14px">ACTIVIDAD:</div>
    <div class="actividad">${f.actividad||f.observaciones||'SIN ACTIVIDAD'}</div>
  `;
})();
</script>
</body>
</html>
